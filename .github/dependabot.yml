version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: &daily
      interval: daily
      time: "09:00"
      timezone: Europe/Madrid
    commit-message:
      prefix: ci

  - package-ecosystem: uv
    directory: /
    schedule: *daily
    commit-message:
      prefix: deps
      include: scope
    groups:
      python-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
