name: Issue labels

# A new issue gets the labels its form answers name (.github/labeler.yml): players cannot set labels themselves. Only
# on opened, and without sync-labels, so labels set by hand at triage stay.
on:
  issues:
    types: [opened]

permissions:
  issues: write
  contents: read

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: github/issue-labeler@v3.5
        with:
          configuration-path: .github/labeler.yml
          enable-versioned-regex: 0
