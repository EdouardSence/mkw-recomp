# Known error signatures and the issue that tracks each, read by classify.py: a new issue whose text holds every string
# of `all` (case-insensitive) is answered "looks like #issue" and closed as its duplicate after 3 days unless its author
# replies. With `fixed`, only reports from an earlier release match: the same text on that release or later is a
# regression and stays open for a person to read.
# A row goes in when a reply groups issues by cause; keep the strings specific (a bare "failed (-4)" is every GPU loss).

[[signature]]
issue = 22
all = ["instruction pointer invalid"]
what = "the GPU faults mid-draw on NVIDIA (\"device fault: instruction pointer invalid\")"

[[signature]]
issue = 1
all = ["gamelib.h", "file not found"]
fixed = "v0.1.2"
what = "the setup could not find `gamelib.h`"

[[signature]]
issue = 29
all = ["spec.py", "args.cc.split"]
fixed = "v0.1.5"
what = "the shader step split the compiler's path at a space in the game folder"

[[signature]]
issue = 18
all = ["is not Mario Kart World 1.0.0 (build id"]
what = "the game copy is not version 1.0.0 (usually an update merged into the dump)"

[[signature]]
issue = 83
all = ["reading address 0xd8", "f_7002637e5c"]
what = "the game window lost the focus during the boot, and the game read a manager it had not made yet"

[[signature]]
issue = 88
all = ["AMD proprietary driver", "Device lost detected; 0 addresses"]
what = "AMD's Windows driver loses the device in a mesh shader dispatch a few seconds into the title"
